services:
  app:
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://forge:${POSTGRES_PASSWORD:-local_demo_only}@db:5432/forge
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
      POSTGRES_DB: forge
    volumes:
      - forge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  forge_pg:
